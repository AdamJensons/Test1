  <script type="text/babel">

const DAY_TYPES = [
  { id: "work", label: "Рабочий день", color: "#1a56db", icon: "🚌" },
  { id: "extra", label: "Подработка", color: "#0e9f6e", icon: "⭐" },
  { id: "off", label: "Выходной", color: "#6b7280", icon: "🏠" },
  { id: "vacation", label: "Отпуск", color: "#f59e0b", icon: "☀️" },
  { id: "sick", label: "Больничный", color: "#ef4444", icon: "🏥" },
];

const CONTACTS = [
  { name: "Поликарп", phone: "88005553535", dept: "Водитель ПС" },
];

const SCHEDULE_PHOTOS = window.__PHOTOS__;

const SCHEDULES = [
  { id: "20_1", label: "20/1", type: "раб.", route: 20, shift: 1 },
  { id: "20_7", label: "20/7", type: "вых.", route: 20, shift: 7 },
  { id: "47_14", label: "47/14", type: "раб.", route: 47, shift: 14 },
  { id: "48_1", label: "48/1", type: "раб.", route: 48, shift: 1 },
  { id: "45_10", label: "45/10", type: "вых.", route: 45, shift: 10 },
  { id: "20_4", label: "20/4", type: "раб.", route: 20, shift: 4 },
  { id: "31_7", label: "31/7", type: "вых.", route: 31, shift: 7 },
  { id: "22_3", label: "22/3", type: "раб.", route: 22, shift: 3 },
  { id: "15_2", label: "15/2", type: "вых.", route: 15, shift: 2 },
];

const MONTHS_RU = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const DAYS_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

function getDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function getFirstDayOfMonth(year, month) { let d = new Date(year, month, 1).getDay(); return d === 0 ? 6 : d - 1; }
function dateKey(y, m, d) { return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

const labelStyle = { fontSize: 11, fontWeight: 600, color: "#94a3b8", textTransform: "uppercase", letterSpacing: 0.8, display: "block", marginBottom: 4 };
const inputStyle = { width: "100%", padding: "10px 12px", borderRadius: 10, border: "2px solid #e2e8f0", fontSize: 14, color: "#0f172a", outline: "none", boxSizing: "border-box", fontFamily: "'Geologica', sans-serif", background: "#f8fafc" };
const navBtn = { background: "#f1f5f9", border: "none", borderRadius: 10, width: 40, height: 40, fontSize: 22, cursor: "pointer", color: "#475569", display: "flex", alignItems: "center", justifyContent: "center" };

function SchedulePlaceholder({ label, route, shift }) {
  return (
    <div style={{ width:"100%", height:"100%", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:16, background:"linear-gradient(135deg,#0f2b6b,#1a56db)", color:"white" }}>
      <div style={{ fontSize:64, fontWeight:800 }}>{label}</div>
      <div style={{ fontSize:20 }}>{route}</div>
      <div style={{ fontSize:16, opacity:0.7 }}>{shift}</div>
      <div style={{ marginTop:24, padding:"8px 20px", background:"rgba(255,255,255,0.15)", borderRadius:8, fontSize:13 }}>📋 Здесь будет фото расписания</div>
    </div>
  );
}

function DayModal({ date, data, onSave, onClose }) {
  const [type, setType] = useState(data?.type || "off");
  const [timeStart, setTimeStart] = useState(data?.timeStart || "");
  const [timeEnd, setTimeEnd] = useState(data?.timeEnd || "");
  const [route, setRoute] = useState(data?.route || "");
  const [order, setOrder] = useState(data?.order || "");
  const [vehicle, setVehicle] = useState(data?.vehicle || "");
  const [note, setNote] = useState(data?.note || "");
  const [reserve, setReserve] = useState(data?.reserve || false);
  const [reserveStart, setReserveStart] = useState(data?.reserveStart || "");
  const [reserveEnd, setReserveEnd] = useState(data?.reserveEnd || "");
  const [reserveHours, setReserveHours] = useState(data?.reserveHours || "");
  const [photos, setPhotos] = useState(data?.photos || []);
  const fileRef = useRef();
  const isWork = type === "work" || type === "extra";

  function calcHours() {
    if (!timeStart || !timeEnd) return "";
    const [sh, sm] = timeStart.split(":").map(Number);
    const [eh, em] = timeEnd.split(":").map(Number);
    let mins = (eh * 60 + em) - (sh * 60 + sm);
    if (mins < 0) mins += 24 * 60;
    return `${Math.floor(mins/60)}ч ${mins%60}м`;
  }

  function handlePhoto(e) {
    Array.from(e.target.files).forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => setPhotos(p => [...p, ev.target.result]);
      reader.readAsDataURL(f);
    });
  }

  function handleSave() {
    onSave({ type, timeStart, timeEnd, route, order, vehicle, note, reserve, reserveStart, reserveEnd, reserveHours, photos });
    onClose();
  }

  const dayType = DAY_TYPES.find(d => d.id === type);

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:100, display:"flex", alignItems:"flex-end", justifyContent:"center" }} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ background:"#fff", borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, maxHeight:"92vh", overflow:"auto", paddingBottom:32 }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"20px 20px 16px", borderBottom:"1px solid #f1f5f9", position:"sticky", top:0, background:"#fff", zIndex:1 }}>
          <div>
            <div style={{ fontSize:18, fontWeight:700, color:"#0f172a" }}>{date.day} {MONTHS_RU[date.month]}</div>
            <div style={{ fontSize:13, color:"#64748b", marginTop:2 }}>{dayType.icon} {dayType.label}</div>
          </div>
          <button onClick={onClose} style={{ background:"#f1f5f9", border:"none", borderRadius:10, width:36, height:36, cursor:"pointer", fontSize:18, color:"#64748b" }}>✕</button>
        </div>
        <div style={{ padding:"20px 20px 0" }}>
          <div style={{ marginBottom:20 }}>
            <label style={labelStyle}>Тип дня</label>
            <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginTop:8 }}>
              {DAY_TYPES.map(dt => (
                <button key={dt.id} onClick={() => setType(dt.id)} style={{ padding:"8px 14px", borderRadius:10, border:"2px solid", borderColor:type===dt.id?dt.color:"#e2e8f0", background:type===dt.id?dt.color:"#fff", color:type===dt.id?"#fff":"#475569", fontSize:13, fontWeight:600, cursor:"pointer" }}>{dt.icon} {dt.label}</button>
              ))}
            </div>
          </div>
          {isWork && (<>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
              <div><label style={labelStyle}>Начало смены</label><input type="time" value={timeStart} onChange={e => setTimeStart(e.target.value)} style={inputStyle}/></div>
              <div><label style={labelStyle}>Конец смены</label><input type="time" value={timeEnd} onChange={e => setTimeEnd(e.target.value)} style={inputStyle}/></div>
            </div>
            {timeStart && timeEnd && (
              <div style={{ background:"#eff6ff", borderRadius:10, padding:"10px 14px", marginBottom:16, display:"flex", alignItems:"center", gap:8 }}>
                <span>⏱</span><span style={{ fontSize:14, fontWeight:600, color:"#1a56db" }}>Время работы: {calcHours()}</span>
              </div>
            )}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:16 }}>
              <div><label style={labelStyle}>Маршрут</label><input placeholder="№" value={route} onChange={e => setRoute(e.target.value)} style={inputStyle}/></div>
              <div><label style={labelStyle}>Наряд</label><input placeholder="№" value={order} onChange={e => setOrder(e.target.value)} style={inputStyle}/></div>
              <div><label style={labelStyle}>Машина</label><input placeholder="№" value={vehicle} onChange={e => setVehicle(e.target.value)} style={inputStyle}/></div>
            </div>
            <div style={{ marginBottom:16 }}>
              <button onClick={() => setReserve(r => !r)} style={{ display:"flex", alignItems:"center", gap:8, width:"100%", background:reserve?"#eff6ff":"#f8fafc", border:`2px solid ${reserve?"#1a56db":"#e2e8f0"}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", fontSize:14, fontWeight:600, color:reserve?"#1a56db":"#475569" }}>
                <span>🕐</span> Добавить запас {reserve?"▲":"▼"}
              </button>
              {reserve && (
                <div style={{ background:"#f8fafc", borderRadius:"0 0 10px 10px", border:"2px solid #e2e8f0", borderTop:"none", padding:14, display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10 }}>
                  <div><label style={labelStyle}>Начало</label><input type="time" value={reserveStart} onChange={e => setReserveStart(e.target.value)} style={inputStyle}/></div>
                  <div><label style={labelStyle}>Конец</label><input type="time" value={reserveEnd} onChange={e => setReserveEnd(e.target.value)} style={inputStyle}/></div>
                  <div><label style={labelStyle}>Часов</label><input placeholder="0" type="number" value={reserveHours} onChange={e => setReserveHours(e.target.value)} style={inputStyle}/></div>
                </div>
              )}
            </div>
            <div style={{ marginBottom:16 }}>
              <label style={labelStyle}>Фото (путевой лист и др.)</label>
              <input ref={fileRef} type="file" accept="image/*" multiple capture="environment" onChange={handlePhoto} style={{ display:"none" }}/>
              <button onClick={() => fileRef.current.click()} style={{ width:"100%", padding:"12px", borderRadius:10, border:"2px dashed #bfdbfe", background:"#eff6ff", color:"#1a56db", fontSize:14, fontWeight:600, cursor:"pointer", marginTop:8 }}>📷 Добавить фото</button>
              {photos.length > 0 && (
                <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:10 }}>
                  {photos.map((p,i) => (
                    <div key={i} style={{ position:"relative" }}>
                      <img src={p} alt="" style={{ width:70, height:70, objectFit:"cover", borderRadius:8 }}/>
                      <button onClick={() => setPhotos(ps => ps.filter((_,j) => j!==i))} style={{ position:"absolute", top:-6, right:-6, background:"#ef4444", color:"#fff", border:"none", borderRadius:"50%", width:20, height:20, fontSize:11, cursor:"pointer", fontWeight:700 }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </>)}
          <div style={{ marginBottom:20 }}>
            <label style={labelStyle}>Примечание</label>
            <textarea value={note} onChange={e => setNote(e.target.value)} placeholder="Заметки к этому дню..." style={{ ...inputStyle, height:80, resize:"none", lineHeight:1.5 }}/>
          </div>
          <button onClick={handleSave} style={{ width:"100%", padding:"14px", background:"#1a56db", color:"#fff", border:"none", borderRadius:12, fontSize:16, fontWeight:700, cursor:"pointer" }}>Сохранить</button>
        </div>
      </div>
    </div>
  );
}

function CalendarTab() {
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth());
  const [dayData, setDayData] = useState(() => {
    try { return JSON.parse(localStorage.getItem("calendarData") || "{}"); } catch { return {}; }
  });
  const [selectedDay, setSelectedDay] = useState(null);

  const daysInMonth = getDaysInMonth(year, month);
  const firstDay = getFirstDayOfMonth(year, month);

  function prevMonth() { if (month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); }
  function nextMonth() { if (month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); }
  function getDayType(day) { return dayData[dateKey(year,month,day)]; }
  function saveDayData(day, data) {
    setDayData(prev => {
      const next = { ...prev, [dateKey(year,month,day)]: data };
      localStorage.setItem("calendarData", JSON.stringify(next));
      return next;
    });
  }

  const stats = { work:0, extra:0, off:0, vacation:0, sick:0 };
  Object.values(dayData).forEach(d => { if (d?.type) stats[d.type] = (stats[d.type]||0)+1; });

  return (
    <div style={{ padding:"0 16px 80px" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"20px 0 16px" }}>
        <button onClick={prevMonth} style={navBtn}>‹</button>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontSize:20, fontWeight:800, color:"#0f172a" }}>{MONTHS_RU[month]}</div>
          <div style={{ fontSize:13, color:"#94a3b8" }}>{year}</div>
        </div>
        <button onClick={nextMonth} style={navBtn}>›</button>
      </div>
      <div style={{ display:"flex", gap:6, marginBottom:16, overflowX:"auto", paddingBottom:4 }}>
        {DAY_TYPES.filter(d => stats[d.id]>0).map(dt => (
          <div key={dt.id} style={{ background:dt.color+"18", border:`1px solid ${dt.color}40`, borderRadius:8, padding:"4px 10px", display:"flex", gap:4, alignItems:"center", whiteSpace:"nowrap", flexShrink:0 }}>
            <span style={{ fontSize:12 }}>{dt.icon}</span>
            <span style={{ fontSize:12, fontWeight:600, color:dt.color }}>{stats[dt.id]}</span>
          </div>
        ))}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
        {DAYS_SHORT.map(d => <div key={d} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:d==="Сб"||d==="Вс"?"#ef4444":"#94a3b8", padding:"4px 0" }}>{d}</div>)}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4 }}>
        {Array.from({length:firstDay}).map((_,i) => <div key={`e${i}`}/>)}
        {Array.from({length:daysInMonth},(_,i)=>i+1).map(day => {
          const data = getDayType(day);
          const dt = data ? DAY_TYPES.find(t => t.id===data.type) : null;
          const isToday = day===today.getDate() && month===today.getMonth() && year===today.getFullYear();
          const dayOfWeek = (firstDay+day-1)%7;
          const isWeekend = dayOfWeek===5||dayOfWeek===6;
          return (
            <button key={day} onClick={() => setSelectedDay(day)} style={{ aspectRatio:"1", borderRadius:10, border:"none", background:dt?dt.color:isWeekend?"#fef2f2":"#f8fafc", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:1, outline:isToday?"2.5px solid #1a56db":"none", outlineOffset:2, position:"relative" }}>
              <span style={{ fontSize:15, fontWeight:isToday?800:600, color:dt?"#fff":isWeekend?"#ef4444":"#0f172a" }}>{day}</span>
              {dt && <span style={{ fontSize:10 }}>{dt.icon}</span>}
            </button>
          );
        })}
      </div>
      {selectedDay && <DayModal date={{day:selectedDay,month,year}} data={dayData[dateKey(year,month,selectedDay)]} onSave={data=>saveDayData(selectedDay,data)} onClose={()=>setSelectedDay(null)}/>}
    </div>
  );
}

function SchedulesTab() {
  const [fullscreen, setFullscreen] = useState(null);
  const [filterType, setFilterType] = useState("все");
  const [filterRoute, setFilterRoute] = useState("все");
  const [filterShift, setFilterShift] = useState("все");

  const routes = [...new Set(SCHEDULES.map(s=>s.route))].sort((a,b)=>a-b);
  const shifts = [...new Set(SCHEDULES.map(s=>s.shift))].sort((a,b)=>a-b);

  const filtered = SCHEDULES
    .filter(s => filterType==="все" || s.type===filterType)
    .filter(s => filterRoute==="все" || s.route===filterRoute)
    .filter(s => filterShift==="все" || s.shift===filterShift)
    .sort((a,b) => a.route!==b.route ? a.route-b.route : a.shift-b.shift);

  const CHIP = (active, label, onClick) => (
    <button onClick={onClick} style={{ padding:"5px 12px", borderRadius:20, border:"none", cursor:"pointer", fontSize:12, fontWeight:600, background:active?"#0f172a":"#e2e8f0", color:active?"#fff":"#64748b", whiteSpace:"nowrap", flexShrink:0 }}>{label}</button>
  );

  return (
    <div style={{ padding:"16px 16px 80px" }}>
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:11, fontWeight:600, color:"#94a3b8", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Тип</div>
        <div style={{ display:"flex", gap:6 }}>
          {CHIP(filterType==="все","Все",()=>setFilterType("все"))}
          {CHIP(filterType==="раб.","🟡 Рабочие",()=>setFilterType("раб."))}
          {CHIP(filterType==="вых.","🔴 Выходные",()=>setFilterType("вых."))}
        </div>
      </div>
      <div style={{ marginBottom:12 }}>
        <div style={{ fontSize:11, fontWeight:600, color:"#94a3b8", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Маршрут {filterRoute!=="все"&&<span style={{color:"#1a56db"}}>— №{filterRoute}</span>}</div>
        <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:4 }}>
          {CHIP(filterRoute==="все","Все",()=>setFilterRoute("все"))}
          {routes.map(r=>CHIP(filterRoute===r,`№${r}`,()=>setFilterRoute(r)))}
        </div>
      </div>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:11, fontWeight:600, color:"#94a3b8", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Наряд {filterShift!=="все"&&<span style={{color:"#1a56db"}}>— №{filterShift}</span>}</div>
        <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:4 }}>
          {CHIP(filterShift==="все","Все",()=>setFilterShift("все"))}
          {shifts.map(n=>CHIP(filterShift===n,`№${n}`,()=>setFilterShift(n)))}
        </div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8 }}>
        {filtered.map(s => {
          const isWork = s.type==="раб.";
          const bg = isWork?"#fef3c7":"#fee2e2";
          const border = isWork?"#f59e0b":"#ef4444";
          const textColor = isWork?"#92400e":"#991b1b";
          return (
            <button key={s.id} onClick={()=>setFullscreen(s)} style={{ background:bg, border:`2px solid ${border}`, borderRadius:10, padding:"10px 8px", cursor:"pointer", textAlign:"center" }}>
              <div style={{ fontSize:15, fontWeight:800, color:textColor, lineHeight:1.2 }}>{s.label}</div>
              <div style={{ fontSize:11, fontWeight:600, color:textColor, opacity:0.75, marginTop:2 }}>{s.type}</div>
            </button>
          );
        })}
      </div>
      {filtered.length===0 && <div style={{ textAlign:"center", padding:"40px 0", color:"#94a3b8", fontSize:14 }}>Нет расписаний по выбранным фильтрам</div>}
      {fullscreen && (
        <div style={{ position:"fixed", inset:0, zIndex:200, background:"#000" }}>
          {SCHEDULE_PHOTOS[fullscreen.id]
            ? <img src={SCHEDULE_PHOTOS[fullscreen.id]} alt="Расписание" style={{ width:"100%", height:"100%", objectFit:"contain", background:"#fff" }}/>
            : <SchedulePlaceholder label={`${fullscreen.label} ${fullscreen.type}`} route={`Маршрут ${fullscreen.route}`} shift={`${fullscreen.shift} наряд`}/>
          }
          <button onClick={()=>setFullscreen(null)} style={{ position:"absolute", top:16, left:16, background:"rgba(0,0,0,0.5)", backdropFilter:"blur(8px)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:10, color:"#fff", padding:"8px 16px", fontSize:14, fontWeight:600, cursor:"pointer" }}>‹ Назад</button>
        </div>
      )}
    </div>
  );
}

function ContactsTab() {
  const [called, setCalled] = useState(null);
  function handleCall(c) {
    setCalled(c.name);
    window.location.href = `tel:${c.phone}`;
    setTimeout(()=>setCalled(null), 2000);
  }
  return (
    <div style={{ padding:"20px 16px 80px" }}>
      <div style={{ marginBottom:20 }}>
        <div style={{ fontSize:20, fontWeight:800, color:"#0f172a" }}>Контакты</div>
        <div style={{ fontSize:13, color:"#94a3b8", marginTop:2 }}>Полезные номера телефонов</div>
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {CONTACTS.map((c,i) => (
          <div key={i} style={{ background:"#fff", borderRadius:14, padding:"14px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", border:"2px solid #e2e8f0", boxShadow:"0 1px 4px rgba(0,0,0,0.04)" }}>
            <div>
              <div style={{ fontSize:15, fontWeight:700, color:"#0f172a" }}>{c.name}</div>
              <div style={{ fontSize:13, color:"#94a3b8", marginTop:2 }}>{c.phone}</div>
              <div style={{ fontSize:11, color:"#1a56db", fontWeight:600, marginTop:4, background:"#eff6ff", borderRadius:4, padding:"2px 6px", display:"inline-block" }}>{c.dept}</div>
            </div>
            <button onClick={()=>handleCall(c)} style={{ background:called===c.name?"#0e9f6e":"#1a56db", color:"#fff", border:"none", borderRadius:12, width:48, height:48, fontSize:20, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              {called===c.name?"✓":"📞"}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("calendar");
  const tabs = [
    { id:"calendar", icon:"📅", label:"Календарь" },
    { id:"schedules", icon:"📋", label:"Расписания" },
    { id:"contacts", icon:"📞", label:"Контакты" },
  ];
  return (
    <div style={{ maxWidth:480, margin:"0 auto", minHeight:"100vh", background:"#f1f5f9", position:"relative" }}>
      <div style={{ background:"linear-gradient(135deg,#0f2b6b,#1a56db)", padding:"16px 20px 20px", boxShadow:"0 4px 20px rgba(26,86,219,0.3)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ width:36, height:36, background:"rgba(255,255,255,0.18)", borderRadius:9, display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>🚌</div>
          <div style={{ color:"#fff", fontSize:17, fontWeight:700 }}>ГУП ГЭТ Гид</div>
        </div>
      </div>
      <div>
        {tab==="calendar" && <CalendarTab/>}
        {tab==="schedules" && <SchedulesTab/>}
        {tab==="contacts" && <ContactsTab/>}
      </div>
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)", width:"100%", maxWidth:480, background:"#fff", borderTop:"1px solid #e2e8f0", display:"flex", boxShadow:"0 -4px 20px rgba(0,0,0,0.08)", zIndex:50 }}>
        {tabs.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{ flex:1, padding:"10px 0 14px", border:"none", background:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, position:"relative" }}>
            <div style={{ fontSize:22, filter:tab===t.id?"none":"grayscale(1) opacity(0.5)" }}>{t.icon}</div>
            <div style={{ fontSize:11, fontWeight:600, color:tab===t.id?"#1a56db":"#94a3b8" }}>{t.label}</div>
            {tab===t.id && <div style={{ position:"absolute", bottom:0, width:32, height:3, background:"#1a56db", borderRadius:"2px 2px 0 0" }}/>}
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
}
  </script>
